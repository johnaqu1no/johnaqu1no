name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["profile.toml", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt pillow numpy
      - run: python scripts/fetch_contributions.py
        env:
          # PAT with read:user counts private-repo work; falls back to public only
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/make_info_card.py
      - run: python scripts/make_ascii_svg.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json *.svg"
