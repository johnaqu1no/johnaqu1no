# Everything the generators read. Edit this, then run `make` (or let the workflow do it).

username = "johnaqu1no"
prompt_host = "johnaqu1no@github"

[theme]
bg = "#0d1117"
border = "#30363d"
fg = "#c9d1d9"
dim = "#8b949e"
key = "#39d353"
accent = "#58a6ff"
